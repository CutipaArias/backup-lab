# Blueprint de Render: crea la base de datos y el servicio web.
# autoDeploy está en false a propósito: el despliegue lo dispara GitHub Actions
# (con un Deploy Hook) solo cuando las pruebas pasan.
databases:
  - name: backuplab-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList:            # acceso externo para el backup programado de GitHub Actions
      - source: 0.0.0.0/0
        description: GitHub Actions (IPs variables)

services:
  - type: web
    name: backuplab
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backuplab-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BACKUP_RETENTION
        value: "5"
