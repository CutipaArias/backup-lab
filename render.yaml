# Blueprint de Render: crea la base de datos y el servicio web.
# El despliegue lo hace Render solo cuando pasan los checks de GitHub Actions.
databases:
  - name: backuplab-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList:
      - source: 0.0.0.0/0
        description: GitHub Actions (IPs variables)

services:
  - type: web
    name: backuplab
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backuplab-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BACKUP_RETENTION
        value: "5"
